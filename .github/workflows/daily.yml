name: Daily price check
# 04:00 Belgrade: full run (every store's whole catalogue in parallel + pametno.rs + database + notification)
# 10:40 / 14:40 / 18:40: light refresh (first pages of every category, laid over the morning catalogue)
on:
  schedule:
    - cron: "0 3 * * *"         # 04:00 Belgrade (winter time; 05:00 in summer) – full
    - cron: "40 9 * * *"        # 10:40 – refresh
    - cron: "40 13 * * *"       # 14:40 – refresh
    - cron: "40 17 * * *"       # 18:40 – refresh
  workflow_dispatch:
    inputs:
      mode:
        description: "full = whole catalogues + pametno + notification; refresh = light update of prices; site = no crawl, just re-publish the website design"
        type: choice
        options: [full, refresh, site]
        default: full
      no_pametno:
        description: "Skip the pametno.rs market check"
        type: boolean
        default: false
      dry_run:
        description: "Don't write the online database"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency: { group: daily, cancel-in-progress: false }
env:
  MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' && 'full' || 'refresh') || inputs.mode || 'full' }}
  TZ: Europe/Belgrade
  PYTHONUNBUFFERED: "1"

jobs:
  crawl:
    name: crawl ${{ matrix.store }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        store: [gigatron, winwin, bigbang, ananas, pcpractic, eurotehna, pametno]   # dotmarket, bazzar: Cloudflare blocks GitHub's servers
    steps:
      - uses: actions/checkout@v7
      - name: Decide
        id: go
        run: |
          RUN=yes
          if [ "$MODE" = "site" ]; then RUN=no; fi
          if [ "${{ matrix.store }}" = "pametno" ]; then
            if [ "$MODE" != "full" ] || [ "${{ inputs.no_pametno }}" = "true" ]; then RUN=no; fi
          fi
          echo "run=$RUN" >> $GITHUB_OUTPUT; echo "mode=$MODE run=$RUN"
      - uses: actions/setup-python@v7
        if: steps.go.outputs.run == 'yes'
        with: { python-version: "3.12", cache: pip }
      - name: Install
        if: steps.go.outputs.run == 'yes'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Restore state (cached 30-day lows, specs, pametno results)
        if: steps.go.outputs.run == 'yes'
        uses: actions/cache/restore@v6
        with: { path: state, key: "state-${{ github.run_id }}", restore-keys: "state-" }
      - name: Seed state on the very first run
        if: steps.go.outputs.run == 'yes'
        run: mkdir -p state && cp -n seed/state/* state/ 2>/dev/null || true
      - name: Crawl
        if: steps.go.outputs.run == 'yes'
        run: |
          LIGHT=""; if [ "$MODE" = "refresh" ]; then LIGHT="--light"; fi
          python bf_watch.py --only ${{ matrix.store }} $LIGHT
      - name: Hand results to the combine job
        if: always() && steps.go.outputs.run == 'yes'
        uses: actions/upload-artifact@v7
        with: { name: "part-${{ matrix.store }}", path: runs/, retention-days: 3, if-no-files-found: ignore }

  combine:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}     # only for the one-time import of the old Google Sheets
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore price history
        uses: actions/cache/restore@v6
        with: { path: history.sqlite, key: "history-${{ github.run_id }}", restore-keys: "history-" }
      - name: Restore state
        uses: actions/cache/restore@v6
        with: { path: state, key: "state-${{ github.run_id }}", restore-keys: "state-" }
      - name: History missing – rebuild it from the database (or the seed on the very first run)
        run: |
          if [ ! -f history.sqlite ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then python db.py restore history.sqlite || rm -f history.sqlite; fi
          if [ ! -f history.sqlite ] && ls seed/history.part* >/dev/null 2>&1; then cat seed/history.part* | gunzip -c > history.sqlite; echo "seeded history"; fi
          mkdir -p state && cp -n seed/state/* state/ 2>/dev/null || true
      - uses: actions/download-artifact@v8
        with: { pattern: "part-*", path: parts }
      - name: Website only – reuse the data that is already live
        if: env.MODE == 'site'
        run: |
          mkdir -p site && cd site
          curl -fsS "$SITE_URL/data.js" -o data.js && curl -fsS "$SITE_URL/cats.js" -o cats.js || echo "window.CATS={found:{},exclude:{}};" > cats.js
          n=0; while curl -fsS "$SITE_URL/data-$n.js" -o "data-$n.js"; do n=$((n+1)); done; rm -f "data-$n.js"
          cd .. && python watch_patch.py site && python -c "import sys,pathlib; n=int(sys.argv[1]); t=pathlib.Path('site_template.html').read_text(encoding='utf-8'); tags='<script src=\"data.js\"></script>'+''.join(f'<script src=\"data-{k}.js\"></script>' for k in range(n))+'<script src=\"cats.js\"></script>'; pathlib.Path('site/index.html').write_text(t.replace('<!--DATA-->',tags),encoding='utf-8'); print('index.html with',n,'data files')" $n
      - name: Combine, analyse, save to the database, build website
        if: env.MODE != 'site'
        run: |
          ARGS=""
          if [ "$MODE" != "full" ]; then ARGS="$ARGS --refresh"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          mkdir -p parts
          python bf_watch.py --combine parts/* $ARGS
      - name: Save price history
        if: always() && env.MODE != 'site'
        uses: actions/cache/save@v6
        with: { path: history.sqlite, key: "history-${{ github.run_id }}" }
      - name: Save state
        if: always() && env.MODE != 'site'
        uses: actions/cache/save@v6
        with: { path: state, key: "state-${{ github.run_id }}" }
      - name: Check the website before publishing
        id: sitecheck
        if: always()
        run: |
          mkdir -p site
          if [ -n "${{ vars.SITE_DOMAIN }}" ]; then echo "${{ vars.SITE_DOMAIN }}" > site/CNAME; fi
          touch site/.nojekyll
          python site_check.py site
      - uses: actions/upload-pages-artifact@v5
        if: always() && steps.sitecheck.outcome == 'success'
        with: { path: site }
      - id: deploy
        if: always() && steps.sitecheck.outcome == 'success'
        uses: actions/deploy-pages@v5
      - name: Keep run files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-files
          retention-days: 14
          if-no-files-found: ignore
          path: |
            runs/*/run.log
            runs/*/report.txt
            runs/*/catalogue.csv
