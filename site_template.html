   <div class="tags" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">${w[7]!==''&&w[7]!=null?(w[7]>0?`<span class="pill g">−${pct(w[7])} ${t('vsLow')}</span>`:w[7]<0?`<span class="pill b">+${pct(-w[7])} ${t('vsLow')}</span>`:''):''}${mpill(String(w[11]))}
   ${w[8]?`<span class="small mut">${t('mktBest')}: ${f(w[8])} ${esc(w[9])}</span>`:''}</div></div>
   <div class="r"><div class="price">${f(w[4])}</div>${w[5]?`<div class="strike">${f(w[5])}</div>`:''}${w[6]?`<div class="small mut">${t('low30')}: ${f(w[6])}</div>`:''}</div></div>`).join('')}</div></div>`).join('')
  ||`<div class="card empty">${t('watchNone')}</div>`; }
// ---------------------------------------------------------------- Stores
function stores(){ const cnt={}; R.forEach(r=>cnt[r[0]]=(cnt[r[0]]||0)+1);
  main.innerHTML=`<div class="kpis">${Object.entries(cnt).map(([s,n])=>`<div class="kpi"><span>${esc(s)}</span><b>${n.toLocaleString(loc())}</b><span>${t('articles')}</span></div>`).join('')}</div>
  <div class="card"><div class="tw"><table><thead><tr><th>${t('store')}</th><th class="n">${t('st.promos')}</th><th class="n">${t('st.avgClaimed')}</th><th class="n">${t('st.with30')}</th><th class="n">${t('st.real')}</th><th class="n">${t('st.fake')}</th><th class="n">${t('st.raised')}</th><th class="n">${t('st.avgReal')}</th></tr></thead><tbody>
  ${D.summary.map(s=>`<tr style="cursor:default"><td><b>${esc(s[0])}</b></td><td class="n">${s[1]}</td><td class="n">${s[2]!==''?pct(s[2]):''}</td><td class="n">${s[3]}</td><td class="n g">${s[4]}</td><td class="n">${s[5]}</td><td class="n b">${s[6]}</td><td class="n">${s[7]!==''?pct(s[7]):''}</td></tr>`).join('')}</tbody></table></div></div>`; }
function report(){ main.innerHTML=`<div class="card"><p class="mut small" style="margin-top:0">${t('reportNote')}</p><pre>${esc(D.report||'–')}</pre></div>`; }
// ---------------------------------------------------------------- Admin: categories (owner commits on GitHub)
const AD={store:Object.keys(CATS.found)[0]||'',q:'',ex:JSON.parse(JSON.stringify(CATS.exclude||{})),open:{}};
const pretty=s=>{ try{ s=decodeURIComponent(s); }catch(e){} s=s.replace(/-/g,' '); return s.charAt(0).toUpperCase()+s.slice(1); };
function tree(store){ const found=CATS.found[store]||{}; const root={p:'',kids:{},own:0};
  for(const [path,n] of Object.entries(found)){ const segs=path.split('/').filter(Boolean); let node=root, p='';
    segs.forEach(sg=>{ p+='/'+sg; node=node.kids[sg]=node.kids[sg]||{p,kids:{},own:0,name:sg}; }); node.own+=n; node.real=true; }
  const tot=n=>n.tot=n.own+Object.values(n.kids).reduce((a,k)=>a+tot(k),0); tot(root); return root; }
const isEx=(store,p)=>(AD.ex[store]||[]).some(e=>p===e||p.startsWith(e+'/'));
function setEx(store,p,exclude){ let ex=(AD.ex[store]||[]).filter(e=>!(e===p||e.startsWith(p+'/')));
  if(exclude) ex.push(p); else { const anc=ex.find(e=>p.startsWith(e+'/')); if(anc){ // re-include a child of an excluded parent: split the parent
      ex=ex.filter(e=>e!==anc); const sib=(n)=>{ for(const k of Object.values(n.kids)){ if(k.p===p) continue; if(p.startsWith(k.p+'/')) sib(k); else ex.push(k.p); } };
      const find=(n,q)=>n.p===q?n:Object.values(n.kids).map(k=>q.startsWith(k.p)?find(k,q):null).find(Boolean); sib(find(tree(store),anc)); } }
  AD.ex[store]=[...new Set(ex)].sort(); }
function admin(){ const stores=Object.keys(CATS.found);
  if(!stores.length){ main.innerHTML=`<div class="card"><h2>${t('adm.title')}</h2><p class="mut">${t('adm.noData')}</p></div>`; return; }
  let rt=tree(AD.store); while(Object.keys(rt.kids).length===1&&!rt.own){ const k=Object.values(rt.kids)[0]; if(!Object.keys(k.kids).length) break; rt=k; } const q=AD.q.toLowerCase();
  const match=n=>!q||n.p.toLowerCase().includes(q)||Object.values(n.kids).some(match);
  const rowsH=(n,d)=>Object.values(n.kids).sort((a,b)=>b.tot-a.tot).filter(match).map(k=>{ const ex=isEx(AD.store,k.p); const hasK=Object.keys(k.kids).length;
    const partial=!ex&&hasK&&(AD.ex[AD.store]||[]).some(e=>e.startsWith(k.p+'/')); const op=AD.open[k.p]||!!q;
    return `<div class="row" style="padding-left:${d*18}px">${hasK?`<button class="tg" onclick="AD.open['${esc(k.p)}']=${!op};admin()">${op?'▾':'▸'}</button>`:'<span class="tg"></span>'}
     <label><input type="checkbox" ${ex?'':'checked'} data-p="${esc(k.p)}" ${partial?'data-partial="1"':''}> ${esc(pretty(k.name))}</label><span class="c">${k.tot?k.tot.toLocaleString(loc()):t('adm.notCrawled')}</span></div>${hasK&&op?rowsH(k,d+1):''}`; }).join('');
  const json=JSON.stringify({_help:'Categories left OUT of the detailed crawl (path prefixes). Edit via the website #admin.',exclude:Object.fromEntries(Object.entries(AD.ex).map(([s,v])=>[s,v]))},null,2);
  main.innerHTML=`<div class="card"><h2>${t('adm.title')}</h2><p class="mut">${t('adm.intro')}</p>
   <div class="chips">${stores.map(s=>`<button class="chip ${s===AD.store?'on':''}" onclick="AD.store='${esc(s)}';admin()">${esc(s)} <span class="mut">· ${t('adm.excluded')((AD.ex[s]||[]).length)}</span></button>`).join('')}</div>
   <div class="searchrow" style="margin:12px 0"><div class="sbox"><input id="aq" placeholder="${t('adm.filter')}" value="${esc(AD.q)}" style="padding-left:14px"></div>
    <button class="btn" onclick="AD.ex[AD.store]=[];admin()">${t('adm.all')}</button><button class="btn" onclick="AD.ex[AD.store]=Object.values(tree(AD.store).kids).map(k=>k.p);admin()">${t('adm.none')}</button></div>
   <div class="tree" id="tr">${rowsH(rt,0)}</div></div>
   <div class="card"><h3>${t('adm.json')}</h3><textarea id="js" readonly>${esc(json)}</textarea>
   <p><button class="btn pri" id="sv">${t('adm.save')}</button> <span id="cp" class="small g"></span></p></div>`;
  tr.querySelectorAll('input[type=checkbox]').forEach(c=>{ if(c.dataset.partial) c.indeterminate=true; c.onchange=()=>{ setEx(AD.store,c.dataset.p,!c.checked); const y=scrollY; admin(); scrollTo(0,y); }; });
  let tm; aq.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ AD.q=aq.value; admin(); const e=document.getElementById('aq'); e.focus(); e.setSelectionRange(e.value.length,e.value.length); },250); };
  sv.onclick=async()=>{ try{ await navigator.clipboard.writeText(json); }catch(e){ js.select(); document.execCommand('copy'); }
    cp.textContent=t('adm.copied'); window.open(`https://github.com/${D.repo}/edit/main/categories.json`,'_blank','noopener'); }; }
// ---------------------------------------------------------------- shell
const TABS=['search','deals','drops','watch','stores','report'];
const FN={search,deals,drops,watch,stores,report,admin};
let cur='search';
function tabs(){ const list=TABS.concat(location.hash==='#admin'?['admin']:[]);
  document.getElementById('tabs').innerHTML=list.map(k=>`<button data-t="${k}" class="${k===cur?'on':''}">${t('tabs.'+k)}</button>`).join(''); }
function go(k){ cur=k; tabs(); FN[k](); }
function chrome(){ document.documentElement.lang=lang; tagline.textContent=t('tagline');
  const [d,h]=D.updated.split(' '); const [y,m,dd]=d.split('-');
  upd.innerHTML=`${t('updated')}: <b>${+dd}.${+m}.${y}. ${h}</b><br>${R.length.toLocaleString(loc())} ${t('articles')} · ${uniq(R.map(r=>r[0])).length} ${t('stores')}`;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang)); }
document.getElementById('tabs').onclick=e=>{ const k=e.target.closest('button')?.dataset.t; if(k) go(k); };
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{ lang=b.dataset.l; try{ localStorage.setItem('lang',lang); }catch(e){} chrome(); go(cur); });
window.addEventListener('hashchange',()=>{ if(location.hash==='#admin') go('admin'); else tabs(); });
let wasM=isMobile(); window.addEventListener('resize',()=>{ const m=isMobile(); if(m!==wasM){ wasM=m; go(cur); } });
chrome(); go(location.hash==='#admin'?'admin':'search');
</script></body></html>
