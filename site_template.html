   <div class="ff"><button class="btn pri" style="width:100%" onclick="closeF()" id="fgo"></button></div>`;
  if(mode==='sort'){ fb.innerHTML=`<div class="tgs">${Object.keys(SDEF).filter(k=>k!=='ppu'||S.ppu).map(k=>`<button class="tg ${S.sort===k?'on':''}" data-s="${k}">${k==='ppu'?t('ppuSort')(t('PU')[S.ppu]||''):t('sorts')[k]}</button>`).join('')}</div>`;
    fb.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ S.sort=b.dataset.s; S.dir=SDEF[S.sort]; S.page=0; results(); closeF(); }); fgo.textContent=t('done'); return; }
  fb.innerHTML=Object.keys(MS).map(k=>`<label class="f">${t(MS[k].l)}</label><div class="msbox" data-k="${k}">${msListHTML(k)}</div>`).join('')+
   `<label class="f">${t('price')}</label><span class="rng"><input id="f_min" type="number" inputmode="numeric" placeholder="${t('from')}" value="${S.min}"> – <input id="f_max" type="number" inputmode="numeric" placeholder="${t('to')}" value="${S.max}"></span>
   <div class="tgs">${TOG.map(([k,l])=>`<button class="tg ${S[k]?'on':''}" data-k="${k}">${t(l)}</button>`).join('')}</div>`;
  fb.querySelectorAll('.msbox').forEach(b=>bindMsList(b,b.dataset.k));
  ['min','max'].forEach(k=>fb.querySelector('#f_'+k).addEventListener('change',e=>{ S[k]=e.target.value; S.page=0; afterChange(); }));
  fb.querySelectorAll('.tg[data-k]').forEach(b=>b.onclick=()=>{ S[b.dataset.k]=!S[b.dataset.k]; b.classList.toggle('on',S[b.dataset.k]); S.page=0; afterChange(); });
  fgo.textContent=t('show')(filtered().length.toLocaleString(loc())); }
function closeF(){ if(fs.style.display!=='flex') return; fs.style.display='none'; document.body.style.overflow=''; if(cur==='search') refreshTool(); }
mbf.onclick=()=>openF('filters'); mbs.onclick=()=>openF('sort');
const DS={tab:'both',store:''}; const DL={both:{sort:'save',dir:-1},real:{sort:'save',dir:-1},raised:{sort:'claimed',dir:-1},fake:{sort:'claimed',dir:-1}};
function deals(){ const base=X.filter(x=>!DS.store||x.r[0]===DS.store);
  const sets={both:base.filter(x=>x.vg==='real'&&/BUY-WORTHY|BEST IN MARKET/.test(x.r[7])),real:base.filter(x=>x.vg==='real'),raised:base.filter(x=>x.vg==='raised'),fake:base.filter(x=>x.vg==='fake')};
  if(!DS.picked){ DS.picked=1; DS.tab=Object.keys(sets).find(k=>sets[k].length)||'both'; }
  const rs=sortRows(sets[DS.tab],SC,DL[DS.tab]); const lim=300;
  main.innerHTML=`<div class="seg">${Object.keys(sets).map(k=>`<button class="${DS.tab===k?'on':''}" data-k="${k}">${t('deals.'+k)}<b class="num">${nf(sets[k].length)}</b></button>`).join('')}</div>
   <h2>${t('deals.'+DS.tab)}</h2><p class="sub">${t('deals.'+DS.tab+'S')}</p>
   <div class="tool" style="margin-bottom:14px"><select class="sel ${DS.store?'set':''}" id="dst">${opt(uniq(X.map(x=>x.r[0])),DS.store,t('allStores'))}</select></div>
   ${!rs.length?`<div class="list empty">${t('none')}</div>`:isM()?`<div class="list m">${rs.slice(0,lim).map(row).join('')}</div>`:tableHTML(rs.slice(0,lim),SC,DL[DS.tab],'dsrt')}
   ${rs.length>lim?`<p class="sub" style="margin-top:12px">${t('more')(lim)}</p>`:''}`;
  main.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ DS.tab=b.dataset.k; deals(); });
  dst.onchange=()=>{ DS.store=dst.value; deals(); }; mbar.style.display='none'; }
function dsrt(k){ setSort(DL[DS.tab],k,SDEF[k]||1); deals(); }
const PF={store:'',sort:'drop',dir:-1};
const PC=[{k:'store',t:'store',v:d=>d[0]},{k:'name',t:'name',v:d=>d[2]},{k:'price',t:'price',n:1,v:d=>d[3]},{k:'drop',t:'save',n:1,v:d=>d[4]-d[3]},{k:'low',t:'low',n:1,hm:1,v:d=>d[8]||null}];
function drops(){ const rs=sortRows(D.drops.filter(d=>!PF.store||d[0]===PF.store),PC,PF);
  const link=d=>d[9]?`<a href="${esc(d[9])}" target="_blank" rel="noopener" style="color:inherit">${esc(d[2])}</a>`:esc(d[2]);
  main.innerHTML=`<h2>${t('drops')}</h2><p class="sub">${t('dropsS')}</p>
   <div class="tool" style="margin-bottom:14px"><select class="sel ${PF.store?'set':''}" id="pst">${opt(uniq(D.drops.map(d=>d[0])),PF.store,t('allStores'))}</select></div>
   ${!rs.length?`<div class="list empty">${t('none')}</div>`:isM()?`<div class="list m">${rs.map(d=>`<div class="it" style="cursor:default"><div class="top"><div><div class="nm">${link(d)}</div><div class="meta">${st(d[0])}</div></div>
     <div class="r"><div class="pr num">${money(d[3])}</div><div class="was num">${nf(d[4])}</div></div></div><div class="bot"><span class="tag good">−${pct(d[5])}</span><span class="save num" style="font-size:13px">−${nf(d[4]-d[3])} din</span></div></div>`).join('')}</div>`
   :`<div class="list"><table>${thead(PC,PF,'psrt')}<tbody>${rs.map(d=>`<tr style="cursor:default"><td>${st(d[0])}</td><td><div class="nm">${link(d)}</div><div class="meta">${esc(d[1])}</div></td>
     <td class="r"><div class="pr num">${money(d[3])}</div><div class="was num">${nf(d[4])}</div></td><td class="r"><span class="save num">−${nf(d[4]-d[3])}</span> <span class="tag good">−${pct(d[5])}</span></td><td class="r hm num">${f(d[8])}</td></tr>`).join('')}</tbody></table></div>`}`;
  pst.onchange=()=>{ PF.store=pst.value; drops(); }; mbar.style.display='none'; }
function psrt(k){ setSort(PF,k,['store','name','price'].includes(k)?1:-1); drops(); }
function watch(){ const g={}; D.watch.forEach(w=>(g[w[0].slice(0,2)]=g[w[0].slice(0,2)]||[]).push(w));
  const order=['G4','G3','G1','G2'].filter(k=>g[k]);
  main.innerHTML=order.map(k=>`<section class="grp"><h2>${esc(t('G')[k])}</h2><p class="sub">${esc(t('G')[k+'s'])}</p>
   <div class="list m">${g[k].map(w=>`<div class="it" style="cursor:default"><div class="top"><div><div class="nm">${w[12]?`<a href="${esc(w[12])}" target="_blank" rel="noopener" style="color:inherit">${esc(w[2])}</a>`:esc(w[2])}</div>
    <div class="meta">${st(w[1])}${w[3]&&k!=='G1'?` &nbsp; ${esc(w[3])}`:''}</div></div>
    <div class="r"><div class="pr num">${money(w[4])}</div>${w[5]?`<div class="was num">${nf(w[5])}</div>`:''}</div></div>
    <div class="bot">${w[7]!==''&&w[7]!=null&&w[7]>=0.05?`<span class="tag good">${t('V.real')} −${pct(w[7])}</span>`:(w[7]!==''&&w[7]<0)?`<span class="tag bad">${t('V.raised')}</span>`:''}${mtag(String(w[11]))}
    ${w[8]?`<span class="meta" style="margin:0">${t('mktBest')}: ${nf(w[8])} (${esc(w[9])})</span>`:''}</div></div>`).join('')}</div></section>`).join('')||`<div class="list empty">${t('noWatch')}</div>`;
  mbar.style.display='none'; }
function stores(){ const cnt={}; R.forEach(r=>cnt[r[0]]=(cnt[r[0]]||0)+1); const mx=Math.max(...Object.values(cnt));
  const sm=Object.fromEntries(D.summary.map(s=>[s[0],s]));
  const th=(x,c)=>`<th class="${c||''}" style="cursor:default">${x}</th>`;
  main.innerHTML=`<h2>${t('storesT')}</h2><p class="sub">${t('storesS')}</p><div class="list"><table><thead><tr>${th(t('c.store'))}${th(t('st.n'),'r')}${th('','hm')}${th(t('st.promos'),'r')}${th(t('st.real'),'r')}${th(t('st.fake'),'r')}${th(t('st.raised'),'r')}${th(t('st.avg'),'r hm')}</tr></thead><tbody>
   ${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([s,n])=>{ const m=sm[s]||[]; return `<tr style="cursor:default"><td>${st(s)}</td><td class="r num"><b>${nf(n)}</b></td><td class="hm"><div class="bar"><i style="width:${n/mx*100}%"></i></div></td>
    <td class="r num">${m[1]??''}</td><td class="r num" style="color:var(--good);font-weight:700">${m[4]??''}</td><td class="r num">${m[5]??''}</td><td class="r num" style="color:var(--danger);font-weight:700">${m[6]??''}</td><td class="r hm num">${m[2]!==''&&m[2]!=null?pct(m[2]):''}</td></tr>`; }).join('')}</tbody></table></div>`;
  mbar.style.display='none'; }
function report(){ main.innerHTML=`<h2>${t('tabs.report')}</h2><p class="sub">${t('reportS')}</p><pre>${esc(D.report||'–')}</pre>`; mbar.style.display='none'; }
const AD={store:Object.keys(CATS.found)[0]||'',q:'',ex:JSON.parse(JSON.stringify(CATS.exclude||{})),open:{}};
const pretty=s=>{ try{ s=decodeURIComponent(s); }catch(e){} s=s.replace(/-/g,' '); return s.charAt(0).toUpperCase()+s.slice(1); };
function tree(store){ const found=CATS.found[store]||{}; const root={p:'',kids:{},own:0};
  for(const [path,n] of Object.entries(found)){ const segs=path.split('/').filter(Boolean); let node=root, p='';
    segs.forEach(sg=>{ p+='/'+sg; node=node.kids[sg]=node.kids[sg]||{p,kids:{},own:0,name:sg}; }); node.own+=n; }
  const tot=n=>n.tot=n.own+Object.values(n.kids).reduce((a,k)=>a+tot(k),0); tot(root); return root; }
const isEx=(s,p)=>(AD.ex[s]||[]).some(e=>p===e||p.startsWith(e+'/'));
function setEx(store,p,exclude){ let ex=(AD.ex[store]||[]).filter(e=>!(e===p||e.startsWith(p+'/')));
  if(exclude) ex.push(p); else { const anc=ex.find(e=>p.startsWith(e+'/')); if(anc){ ex=ex.filter(e=>e!==anc);
      const sib=(n)=>{ for(const k of Object.values(n.kids)){ if(k.p===p) continue; if(p.startsWith(k.p+'/')) sib(k); else ex.push(k.p); } };
      const find=(n,q)=>n.p===q?n:Object.values(n.kids).map(k=>q.startsWith(k.p)?find(k,q):null).find(Boolean); sib(find(tree(store),anc)); } }
  AD.ex[store]=[...new Set(ex)].sort(); }
function admin(){ mbar.style.display='none'; const stores=Object.keys(CATS.found);
  if(!stores.length){ main.innerHTML=`<h2>${t('adm.title')}</h2><p class="sub">${t('adm.noData')}</p>`; return; }
  let rt=tree(AD.store); while(Object.keys(rt.kids).length===1&&!rt.own){ const k=Object.values(rt.kids)[0]; if(!Object.keys(k.kids).length) break; rt=k; }
  const q=AD.q.toLowerCase(); const match=n=>!q||n.p.toLowerCase().includes(q)||Object.values(n.kids).some(match);
  const rowsH=(n,d)=>Object.values(n.kids).sort((a,b)=>b.tot-a.tot).filter(match).map(k=>{ const ex=isEx(AD.store,k.p); const hasK=Object.keys(k.kids).length;
    const partial=!ex&&hasK&&(AD.ex[AD.store]||[]).some(e=>e.startsWith(k.p+'/')); const op=AD.open[k.p]||!!q;
    return `<div class="row" style="padding-left:${d*20}px">${hasK?`<button class="tw" onclick="AD.open['${esc(k.p)}']=${!op};admin()">${op?'▾':'▸'}</button>`:'<span class="tw"></span>'}
     <label><input type="checkbox" ${ex?'':'checked'} data-p="${esc(k.p)}" ${partial?'data-partial="1"':''}> ${esc(pretty(k.name))}</label><span class="c num">${k.tot?nf(k.tot):t('adm.notCrawled')}</span></div>${hasK&&op?rowsH(k,d+1):''}`; }).join('');
  const json=JSON.stringify({_help:'Categories left OUT of the detailed crawl (path prefixes). Edit via the website #admin.',exclude:AD.ex},null,2);
  main.innerHTML=`<h2>${t('adm.title')}</h2><p class="sub" style="max-width:760px">${t('adm.intro')}</p>
   <div class="seg">${stores.map(s=>`<button class="${s===AD.store?'on':''}" onclick="AD.store='${esc(s)}';admin()">${esc(s)}<b>${t('adm.excluded')((AD.ex[s]||[]).length)}</b></button>`).join('')}</div>
   <div class="tool" style="margin-bottom:12px"><span class="rng" style="flex:1"><input id="aq" placeholder="${t('adm.filter')}" value="${esc(AD.q)}" style="width:100%"></span>
    <button class="tg" onclick="AD.ex[AD.store]=[];admin()">${t('adm.all')}</button><button class="tg" onclick="AD.ex[AD.store]=Object.values(tree(AD.store).kids).map(k=>k.p);admin()">${t('adm.none')}</button></div>
   <div class="tree" id="tr">${rowsH(rt,0)}</div>
   <h3 style="margin:22px 0 8px;font-size:14px">${t('adm.json')}</h3><textarea id="js" readonly>${esc(json)}</textarea>
   <p><button class="btn pri" id="sv">${t('adm.save')}</button> <span id="cp" class="sub"></span></p>`;
  tr.querySelectorAll('input[type=checkbox]').forEach(c=>{ if(c.dataset.partial) c.indeterminate=true; c.onchange=()=>{ setEx(AD.store,c.dataset.p,!c.checked); const y=scrollY; admin(); scrollTo(0,y); }; });
  let tm; aq.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ AD.q=aq.value; admin(); const e=document.getElementById('aq'); e.focus(); e.setSelectionRange(e.value.length,e.value.length); },250); };
  sv.onclick=async()=>{ try{ await navigator.clipboard.writeText(json); }catch(e){ js.select(); document.execCommand('copy'); }
    cp.textContent=t('adm.copied'); window.open(`https://github.com/${D.repo}/edit/main/categories.json`,'_blank','noopener'); }; }
const TABS=['search','deals','drops','watch','stores','report']; const FN={search,deals,drops,watch,stores,report,admin};
let cur='search';
function tabs(){ const list=TABS.concat(location.hash==='#admin'?['admin']:[]);
  document.getElementById('tabs').innerHTML=list.map(k=>`<button data-t="${k}" class="${k===cur?'on':''}">${t('tabs.'+k)}</button>`).join(''); }
function go(k){ cur=k; tabs(); FN[k](); scrollTo({top:0}); }
function chrome(){ document.documentElement.lang=lang; const [d,h]=D.updated.split(' '); const [,m,dd]=d.split('-'); const ds=`${+dd}. ${MON[lang][+m-1]}`;
  fresh.textContent=t('fresh')(ds,h)+((D.problems||[]).length?' · '+t('prob')(D.problems.length):''); fresh.title=(D.problems||[]).join('\n');
  foot.innerHTML=`<div><h4>${t('foot.h')}</h4><p>${t('foot.p1')}</p><p>${t('foot.p2')}</p></div><div><h4>${t('foot.h2')}</h4><p>${t('foot.p3')}</p><p>babl · ${t('fresh')(ds,h)}</p></div>`;
  document.querySelectorAll('.lng button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang)); }
document.getElementById('tabs').onclick=e=>{ const k=e.target.closest('button')?.dataset.t; if(k) go(k); };
document.querySelectorAll('.lng button').forEach(b=>b.onclick=()=>{ lang=b.dataset.l; try{ localStorage.setItem('lang',lang); }catch(e){} chrome(); go(cur); });
window.addEventListener('hashchange',()=>{ if(location.hash==='#admin') go('admin'); else tabs(); });
let wasM=isM(); window.addEventListener('resize',()=>{ const m=isM(); if(m!==wasM){ wasM=m; FN[cur](); } });
chrome(); go(location.hash==='#admin'?'admin':'search');
</script></body></html>
